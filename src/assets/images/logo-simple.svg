<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Button and hanger logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- stitched ring -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#fff" stroke-width="4"
          stroke-linecap="round" stroke-dasharray="14 11"/>

  <g transform="translate(0,24)" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- button as the hanger hook -->
    <circle cx="200" cy="128" r="18"/>
    <circle cx="193" cy="128" r="2.5" fill="#fff" stroke="none"/>
    <circle cx="207" cy="128" r="2.5" fill="#fff" stroke="none"/>
    <!-- stem -->
    <path d="M200 146 L200 168"/>
    <!-- hanger body -->
    <path d="M200 168 L120 232 Q110 242 124 242 L276 242 Q290 242 280 232 Z"/>
  </g>
</svg>
